name: Monitor DDJJ — Pipeline Diario

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC / 03:00 Argentina
  workflow_dispatch:
    inputs:
      fases:
        description: 'Fases a ejecutar (ej: 1 2 3 4)'
        required: false
        default: '1 2 3 4'

permissions:
  contents: write

# Una sola corrida a la vez (dos en paralelo chocaban al subir el mismo CSV)
concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      ARCA_CERT: ${{ secrets.ARCA_CERT }}
      ARCA_KEY:  ${{ secrets.ARCA_KEY }}
      ARCA_PROD: ${{ vars.ARCA_PROD || '1' }}   # "1" = producción. Variable, no secret: como secret GitHub tapaba con *** cada "1" de los logs
      # Monitor Contratos (adjudicaciones del Boletín Oficial) para el cruce de conflicto de interés
      CONTRATOS_API_URL: ${{ vars.CONTRATOS_API_URL || 'https://contratos.ecosistematransparencia.com.ar' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements_inocencia.txt

      - name: Crear directorios
        run: mkdir -p data/raw data/processed models

      - name: Fase 1 — ETL
        run: python pipeline.py --fase 1 --sin-indicadores

      - name: Fase 2 — Cruces
        run: python pipeline.py --fase 2 --sin-indicadores

      - name: Fase 3 — Scoring
        run: python pipeline.py --fase 3 --sin-indicadores

      - name: Fase 4 — ML
        run: python pipeline.py --fase 4 --sin-indicadores

      - name: Indicadores Internacionales
        run: python pipeline.py --fase 5

      - name: Commit resultados
        run: |
          git config --global user.name  'Robot Monitor DDJJ'
          git config --global user.email 'robot-ddjj@noreply.github.com'

          git add -f data/processed/sujetos_obligados_clean.csv || true
          git add -f data/processed/scoring_riesgo.csv || true
          git add -f data/processed/anomalias_ml.csv || true
          git add -f data/processed/perfil_riesgo_completo.csv || true
          git add -f data/processed/indicadores_internacionales.csv || true
          git add -f data/processed/alertas_puertas_giratorias.csv || true
          git add -f data/processed/alertas_conflicto.csv || true
          git add -f data/processed/tabla_judicial.csv || true
          git add -f data/processed/tipo_cambio.csv || true
          git add -f data/processed/ddjj_2022_norm.csv data/processed/ddjj_2023_norm.csv || true

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Monitor DDJJ $(date +'%Y-%m-%d') — pipeline completo"
            # -X theirs: si otro commit tocó los mismos CSV, gana lo recién calculado
            git pull --rebase -X theirs origin main
            git push origin main
          else
            git pull --rebase origin main || true
            echo "Sin cambios."
          fi
